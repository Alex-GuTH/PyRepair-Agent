[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrepair-agent"
version = "0.1.0"
description = "A Python and pytest test-repair coding agent harness."
requires-python = ">=3.11"
dependencies = ["typer>=0.26.8", "fastapi>=0.139.0", "uvicorn>=0.51.0"]

[project.scripts]
pyrepair = "pyrepair.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
